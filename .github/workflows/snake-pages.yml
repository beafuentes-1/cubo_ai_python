name: Publish Snake browser game

on:
  push:
    branches: [main, master]
    paths:
      - "desktop/snake-python/web/**"
      - ".github/workflows/snake-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload browser game
        uses: actions/upload-pages-artifact@v3
        with:
          path: desktop/snake-python/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
